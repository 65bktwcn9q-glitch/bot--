version: "3.9"

services:
  api:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - apps/api/.env
    command: >
      sh -c "npm install && cd apps/api && npx prisma db push && npm run dev"
    ports:
      - "4000:4000"

  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - apps/web/.env
    command: >
      sh -c "npm install && npm --workspace apps/web run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"

  tunnel:
    image: cloudflare/cloudflared:latest
    depends_on:
      - web
    command: tunnel --url http://web:5173

volumes:
  node_modules:
