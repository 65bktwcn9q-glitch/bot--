[package]
name = "samp-launcher"
version = "0.1.0"
description = "GTA SA Multiplayer Launcher"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["json", "stream"] }
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros"] }

[dependencies.tauri]
version = "1.6"
features = ["dialog-open", "path-all", "fs-all", "shell-open"]

[build-dependencies]
tauri-build = { version = "1.5", features = [] }
